    <script>
        // TỐI ƯU KHUNG HÌNH: cập nhật biến --app-vh = 1% chiều cao thực tế của viewport
        const setAppVh = () => { document.documentElement.style.setProperty('--app-vh', `${window.innerHeight * 0.01}px`); document.documentElement.style.setProperty('--app-vw', `${window.innerWidth * 0.01}px`); };
        setAppVh();
        window.addEventListener('resize', setAppVh);
        window.addEventListener('orientationchange', setAppVh);

        // Manifest động (giữ nguyên ý tưởng)
        const manifestObj = { "name": "Thien Kieu", "short_name": "ThienKieu", "start_url": ".", "display": "standalone", "background_color": "#000000", "theme_color": "#ffdf00", "icons": [] };
        try {
            const blob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
            const link = document.createElement('link'); link.rel = 'manifest'; link.href = URL.createObjectURL(blob); document.head.appendChild(link);
        } catch (e) { console.warn('Không thể tạo manifest động:', e); }

        // Global error handler: giữ logic, bật safe guard
        window.onerror = function(msg, src, ln, col) {
            if (!msg || msg === 'Script error.' || (ln === 0 && col === 0)) return true;
            let d = document.getElementById('bi-canh-error-banner');
            if (!d) {
                d = document.createElement('div');
                d.id = 'bi-canh-error-banner';
                d.style.cssText = `color: #ff4500; padding: 15px 40px 15px 15px; background: #111; position: fixed; top: 0; z-index: 9999; width: 100%; font-size: 12px; overflow: auto; max-height: 30vh;`;
                document.body.appendChild(d);
            }
            d.innerHTML = `<button onclick="this.parentElement.remove()" style="position:absolute; top:8px; right:10px; background:none; border:none; color:#ff4500; font-size:18px; cursor:pointer;">✕</button><strong>Lỗi:</strong> ${String(msg).slice(0,300).replace(/</g,'&lt;')}`;
            return true;
        };

        // Các thay đổi nhỏ cho console filtering vẫn giữ
        (function(){
            const originalWarn = console.warn.bind(console);
            const originalError = console.error.bind(console);
            console.warn = function(...args) { try { if (typeof args[0] === 'string' && (args[0].includes('cdn.tailwindcss.com') || args[0].includes('in-browser Babel') || args[0].includes('WebChannel'))) return; } catch(e){} originalWarn(...args); };
            console.error = function(...args) { try { if (typeof args[0] === 'string' && args[0].includes('Firestore backend')) return; } catch(e){} originalError(...args); };
        })();

    </script>

<body>
    <noscript><h1>Thiên Kiêu Bí Cảnh - Học ngoại ngữ qua video</h1><p>Web app cần JavaScript để hoạt động. Vui lòng bật JavaScript.</p></noscript>
    <div id="root">
        <div style="display:flex; justify-content:center; align-items:center; height:100vh; color:#ffdf00; font-weight:bold; background:#000;">
            ĐANG TỤ LINH KHÍ...

    <!-- Script chính (JSX) - giữ nguyên nhưng có chỉnh sửa an toàn: không gọi API Key trực tiếp từ client, mọi gọi AI phải đi qua proxy /api/generate -->
    <script type="text/babel" data-type="module">
        // Utility localStorage an toàn
        const safeGetItem = (key) => { try { return localStorage.getItem(key); } catch(e) { return null; } };
        const safeSetItem = (key, val) => { try { localStorage.setItem(key, val); } catch(e) { console.warn("Lỗi ghi nhớ:", e); } };

        // Firebase init (config public client-side) - nếu bạn dùng Firebase, đảm bảo rules chặt
        const firebaseConfig = { apiKey: "AIzaSyAtnPNb-nGauIQZOwVcErwF3FiYcIeN5bw", authDomain: "thienbicanhmong.firebaseapp.com", projectId: "thienbicanhmong", storageBucket: "thienbicanhmong.firebaseapp.com", messagingSenderId: "", appId: "" };
        try { if (window.firebase && !window.firebase.apps?.length) { window.firebase.initializeApp(firebaseConfig); } } catch(e) { console.warn('Firebase chưa sẵn sàng:', e); }

        // AUDIO: mở khoá audio sau tương tác của người dùng
        window.__unlockAudioElement = (a) => { if (!a || a.__unlocked) return; try { const p = a.play(); if (p && p.catch) { p.then(()=>{ a.pause(); a.currentTime = 0; }).catch(()=>{}); } else { a.pause(); a.currentTime = 0; } } catch(e) {} a.__unlocked = true; };
        window.addEventListener('pointerdown', () => { try { const elems = document.querySelectorAll('audio'); elems.forEach(e => window.__unlockAudioElement(e)); } catch(e){} }, { once: true });

        // IMPORTANT SECURITY CHANGE:
        // - Không gọi Generative Language API trực tiếp từ client với API Key stored trong localStorage.
        // - Thay vào đó client sẽ gọi endpoint server-side '/api/generate' (Bạn cần triển khai server proxy sau này).
        // - Nếu server không có, hàm trả lỗi dễ hiểu thay vì lộ key.

        const geminiGenerateContent = async (payload) => {
            try {
                const res = await fetch('/api/generate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) {
                    const txt = await res.text();
                    throw new Error('Lỗi server AI: ' + txt);
                }
                return await res.json();
            } catch (e) {
                // Nếu server chưa được triển khai, trả lỗi rõ ràng (không lộ key)
                throw new Error('API AI chưa được cấu hình trên server. Vui lòng triển khai proxy server-side /api/generate. Chi tiết trong README. (gốc: ' + (e.message||e) + ')');
            }
        };

        const geminiTestKey = async () => {
            // Để test key tạm thời, bạn phải triển khai endpoint server-side /api/gemini-test.
            try {
                const res = await fetch('/api/gemini-test', { method: 'POST' });
                if (!res.ok) return { kind: 'error', msg: await res.text() };
                return await res.json();
            } catch (e) { return { kind: 'error', msg: 'Chưa có endpoint kiểm tra API key trên server' }; }
        };

        // Các helper khác (formatNumber, parseRawQuizText, sanitizeAiMathText, ...) giữ nguyên ý tưởng nhưng tạm gỡ phức tạp để file không quá lớn.
        const formatNumber = (num) => { const n = Number(num) || 0; if (Math.abs(n) < 1000) return String(n); if (Math.abs(n) < 1000000) return (Math.floor(n/100)/10).toString().replace(/\.0$/,'') + 'k'; return (Math.floor(n/100000)/10).toString().replace(/\.0$/,'') + 'm'; };

        const parseRawQuizText = (rawQuizText) => {
            const questionList = []; let currentQuestion = null;
            const canPush = (q) => q && (q.o && q.o.length >= 2 || q.type === 'numeric');
            (rawQuizText || '').split('\n').map(l=>l.trim()).filter(Boolean).forEach(line=>{
                if (/^(Câu|Bài|Q)\s*\d+/i.test(line) || line.includes('?')) {
                    if (canPush(currentQuestion)) questionList.push(currentQuestion);
                    currentQuestion = { q: line.replace(/^(Câu|Bài|Q)\s*\d+[\.\:\s\-]*/i,'').trim(), o: [], c: 0, type: 'single' };
                } else if (/^[A-D][\.\:\)]/i.test(line)) {
                    if (currentQuestion && currentQuestion.o.length < 4) currentQuestion.o.push(line.replace(/^[A-D][\.\:\)]\s*/i,'').trim());
                } else if (/^(Đáp án|DA)[\s\:\.]*/i.test(line)) {
                    if (!currentQuestion) return;
                    const rest = line.replace(/^(Đáp án|DA)[\s\:\.]*/i,'').trim();
                    const letters = [...new Set((rest.match(/[A-D]/gi)||[]).map(l=>l.toUpperCase()))];
                    if (currentQuestion.o.length > 0 && letters.length >= 2) { currentQuestion.type='multi'; currentQuestion.c = letters.map(l=>l.charCodeAt(0)-65).sort((a,b)=>a-b); }
                    else if (currentQuestion.o.length > 0 && letters.length === 1) { currentQuestion.type='single'; currentQuestion.c = letters[0].charCodeAt(0)-65; }
                    else { const numMatch = rest.replace(/,/g,'.').match(/-?\d+(\.\d+)?/); if (numMatch) { currentQuestion.type='numeric'; currentQuestion.c = numMatch[0]; } }
                }
            });
            if (canPush(currentQuestion)) questionList.push(currentQuestion);
            return questionList;
        };

        // Minimal React App placeholder (để file vẫn render). Bạn có thể thay bằng App gốc sau khi tách.
        const { useState, useEffect } = React;
        function App(){
            const [ready, setReady] = useState(false);
            useEffect(()=>{ setTimeout(()=>setReady(true), 300); }, []);
            return (
                <div style={{height:'100%', display:'flex', alignItems:'center', justifyContent:'center', flexDirection:'column'}}>
                    <h1 style={{color:'#ffdf00'}}>Thiên Kiêu Bí Cảnh</h1>
                    <p style={{color:'#e5e5e5'}}>Ứng dụng đang chạy dưới dạng 1 file duy nhất. Vui lòng triển khai server-side /api/generate để bật tính năng AI.</p>
                    <p style={{color:'#bdb76b'}}>{ready ? 'Sẵn sàng' : 'Đang khởi tạo...'}</p>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
